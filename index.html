<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pathos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500&display=swap');

  :root {
    --paper: #1B1A17;
    --paper-dim: #26241F;
    --ink: #EDE8DB;
    --ink-soft: #9C9686;
    --moss: #6E7D5C;
    --moss-deep: #8A9A73;
    --clay: #C17845;
    --line: #3B382F;
    --on-accent: #F5F1E6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 28px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  header h1 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 22px;
    margin: 0;
    letter-spacing: 0.01em;
  }

  header .tagline {
    font-size: 12px;
    color: var(--ink-soft);
    font-style: italic;
  }

  #config {
    padding: 12px 28px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    align-items: center;
    background: var(--paper-dim);
  }

  #config label {
    font-size: 12px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  #config input {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }

  #config button {
    padding: 7px 14px;
    border: 1px solid var(--moss-deep);
    background: var(--moss);
    color: var(--paper);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }

  #config button:hover { background: var(--moss-deep); }

  #status {
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  #thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .msg {
    max-width: 72%;
    padding: 12px 16px;
    border-radius: 8px;
    font-family: 'Source Serif 4', serif;
    font-size: 15px;
    line-height: 1.55;
    white-space: pre-wrap;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--clay);
    color: var(--paper);
    border-radius: 8px 8px 2px 8px;
  }

  .msg.agent {
    align-self: flex-start;
    background: var(--paper-dim);
    border-left: 3px solid var(--moss);
    border-radius: 2px 8px 8px 8px;
  }

  .msg.system {
    align-self: center;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    background: none;
  }

  /* Three Dots Typing Indicator Styles */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-dots span {
    width: 6px;
    height: 6px;
    background-color: var(--ink-soft);
    border-radius: 50%;
    animation: typing 1.4s infinite ease-in-out both;
  }

  .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
  .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

  @keyframes typing {
    0%, 80%, 100% {
      transform: scale(0.6);
      opacity: 0.4;
    }
    40% {
      transform: scale(1);
      opacity: 1;
    }
  }

  #composer {
    padding: 16px 28px 22px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 10px;
  }

  #composer textarea {
    flex: 1;
    resize: none;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--paper-dim);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    height: 44px;
  }

  #composer button {
    padding: 0 20px;
    border: none;
    border-radius: 6px;
    background: var(--moss);
    color: var(--paper);
    font-size: 14px;
    cursor: pointer;
  }

  #composer button:hover { background: var(--moss-deep); }
  #composer button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>Pathos</h1>
  <span class="tagline">better questions lead to better ideas</span>
</header>

<div id="config">
  <span id="status">connecting...</span>
  <button id="connectBtn">Reconnect</button>
</div>

<div id="thread"></div>

<div id="composer">
  <textarea id="input" placeholder="What's on your mind?"></textarea>
  <button id="sendBtn" disabled>Send</button>
</div>

<script>
  const APP_NAME = "pathos_root";
  const USER_ID = "u_" + Math.random().toString(36).slice(2, 10);
  const SESSION_ID = "s_" + Math.random().toString(36).slice(2, 10);

  const baseUrl = "https://pathosai.onrender.com";
  let connected = false;

  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const status = document.getElementById('status');
  const connectBtn = document.getElementById('connectBtn');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
    return div;
  }

  function showTypingIndicator() {
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="typing-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    `;
    thread.appendChild(div);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeTypingIndicator() {
    const indicator = document.getElementById('typing-indicator');
    if (indicator) indicator.remove();
  }

  async function connect() {
    if (connectBtn.disabled) return;
    connectBtn.disabled = true;
    status.textContent = 'connecting...';
    try {
      const res = await fetch(`${baseUrl}/apps/${APP_NAME}/users/${USER_ID}/sessions/${SESSION_ID}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
      });
      if (!res.ok && res.status !== 409) throw new Error('status ' + res.status);
      connected = true;
      status.textContent = 'connected';
      sendBtn.disabled = false;
      addMessage('Session started. Say what you have in mind.', 'system');
    } catch (err) {
      status.textContent = 'failed to connect';
      addMessage('Could not reach the agent at that URL. Check it is correct and CORS is enabled.', 'system');
    } finally {
      connectBtn.disabled = false;
    }
  }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text || !connected) return;
    addMessage(text, 'user');
    input.value = '';
    sendBtn.disabled = true;

    showTypingIndicator();

    try {
      const res = await fetch(`${baseUrl}/run`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          appName: APP_NAME,
          userId: USER_ID,
          sessionId: SESSION_ID,
          newMessage: { role: 'user', parts: [{ text }] }
        })
      });
      if (!res.ok) throw new Error('status ' + res.status);
      const events = await res.json();

      let replyText = '';
      for (const event of events) {
        const parts = event?.content?.parts || [];
        for (const p of parts) {
          if (p.text) replyText += p.text;
        }
      }
      
      removeTypingIndicator();
      addMessage(replyText || '(no text response)', 'agent');
    } catch (err) {
      removeTypingIndicator();
      addMessage('Something went wrong reaching the agent.', 'system');
    } finally {
      sendBtn.disabled = false;
    }
  }

  connectBtn.addEventListener('click', connect);
  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  connect();
</script>

</body>
</html>
